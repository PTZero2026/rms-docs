Application:
  type: object
  additionalProperties: false
  required: [academicTitle, specialty, evidenceFileUrls]
  properties:
    academicTitle: {type: string, minLength: 1, maxLength: 160}
    specialty: {type: string, minLength: 1, maxLength: 240}
    licenseNo: {type: string, maxLength: 100}
    graduationYear: {type: integer}
    researchDirection: {type: string, maxLength: 2000}
    evidenceFileUrls: {type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: {type: string, format: uri}}
ReviewNote:
  type: object
  properties:
    adminNote: {type: string, maxLength: 2000}
AuthorRequest:
  type: object
  required: [id, userId, email, status, application, createdAt, reviewedAt, reviewedById, adminNote]
  properties:
    id: {type: string, format: uuid}
    userId: {type: string, format: uuid}
    email: {type: string}
    status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
    application: {$ref: '#/Application'}
    createdAt: {type: string, format: date-time}
    reviewedAt: {type: [string,'null'], format: date-time}
    reviewedById: {type: [string,'null'], format: uuid}
    adminNote: {type: string}
Requests:
  type: array
  items: {$ref: '#/AuthorRequest'}
