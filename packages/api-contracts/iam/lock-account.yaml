Profile:
  type: object
  required: [id,email,fullName,phone,revision,userType,isActive,deletedAt]
  properties:
    id: {type: string, format: uuid}
    email: {type: string, format: email}
    fullName: {type: string}
    phone: {type: string}
    revision: {type: integer}
    userType: {type: string, enum: [admin,staff,author,user]}
    isActive: {type: boolean}
    deletedAt: {type: string, format: date-time, nullable: true}
ProfileChange:
  type: object
  additionalProperties: false
  required: [fullName,phone,revision]
  properties:
    fullName: {type: string, minLength: 1, maxLength: 160}
    phone: {type: string, maxLength: 32}
    revision: {type: integer, minimum: 0}
Receipt:
  type: object
  required: [account,event]
  properties:
    account: {$ref: '#/Profile'}
    event:
      type: object
      nullable: true
      required: [id,action,at,actorId]
      properties:
        id: {type: string, format: uuid}
        action: {type: string}
        at: {type: string, format: date-time}
        actorId: {type: string, format: uuid, nullable: true}
