Fields:
  type: object
  required: [title,fieldId,months,budget,document,memberIds]
  properties:
    title: {type: string, minLength: 1, maxLength: 240}
    fieldId: {type: string, format: uuid, nullable: true}
    months: {type: integer, nullable: true, minimum: 1}
    budget: {type: integer, nullable: true, minimum: 0}
    document: {type: object, additionalProperties: {type: string}}
    commitments: {type: object,additionalProperties: {type: integer,minimum: 1,maximum: 999}}
    memberIds: {type: array, items: {type: string, format: uuid}}
    revision: {type: integer, minimum: 0}
Field:
  type: object
  required: [key,label,required]
  properties:
    key: {type: string}
    label: {type: string}
    required: {type: boolean}
Proposal:
  allOf:
    - {$ref: '#/Fields'}
    - type: object
      required: [id,callId,projectCode,submittedAt,submitUntil,semantic,step,revision,templateVersion,fields,fieldOptions,members,reason,canEdit,canReturn,canCancel]
      properties:
        id: {type: string, format: uuid}
        callId: {type: string, format: uuid}
        projectCode: {type: string, nullable: true}
        submittedAt: {type: string, format: date-time, nullable: true}
        submitUntil: {type: string, format: date-time, nullable: true, description: Exclusive cutoff for this author to submit the draft in the current call window.}
        semantic: {type: string}
        step: {type: string}
        revision: {type: integer}
        templateVersion: {type: integer}
        fields: {type: array, items: {$ref: '#/Field'}}
        fieldOptions: {type: array, items: {type: object, required: [id,name], properties: {id: {type: string}, name: {type: string}}}}
        members: {type: array, items: {type: object, required: [id,email,principal], properties: {id: {type: string}, email: {type: string}, principal: {type: boolean}}}}
        reason: {type: string, nullable: true}
        canEdit: {type: boolean}
        canReturn: {type: boolean}
        canCancel: {type: boolean, description: The current actor can withdraw the saved proposal through its pinned workflow.}
Command:
  type: object
  required: [action,revision]
  properties:
    action: {type: string, enum: [submit,return,cancel]}
    revision: {type: integer}
    reason: {type: string}
