openapi: 3.0.3
info:
  title: RMS API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API process can serve requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/tenants/{slug}/auth/config:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: getLoginConfiguration
      security: []
      responses:
        '200':
          description: Public identity provider settings for an active tenant.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, clientId]
                properties:
                  issuer: {type: string, format: uri}
                  clientId: {type: string}
        '404': {description: Tenant unavailable}
  /api/tenants/{slug}/auth/me:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: getCurrentAccount
      security: [{bearer: []}]
      responses:
        '200':
          description: Account and effective permissions in this tenant.
          content:
            application/json:
              schema: {$ref: './iam/session.yaml'}
        '401': {description: Invalid or expired access token}
        '403': {description: Access denied}
        '404': {description: Tenant unavailable}
        '409': {description: Email belongs to another identity}
  /api/tenants/{slug}/catalog/theme:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: getActiveTheme
      security: [{bearer: []}]
      responses:
        '200':
          description: Theme in requested tenant.
          content:
            application/json:
              schema: {$ref: "./catalog/theme.yaml#/Active"}
        '400': {description: Invalid theme fields}
        '401': {description: Invalid token}
        '403': {description: Access denied}
        '409': {description: Revision has changed}
  /api/tenants/{slug}/catalog/theme/editor:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: getThemeEditor
      security: [{bearer: []}]
      responses:
        '200':
          description: Theme in requested tenant.
          content:
            application/json:
              schema: {$ref: "./catalog/theme.yaml#/Editor"}
        '400': {description: Invalid theme fields}
        '401': {description: Invalid token}
        '403': {description: Access denied}
        '409': {description: Revision has changed}
  /api/tenants/{slug}/catalog/theme/draft:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    put:
      operationId: saveThemeDraft
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./catalog/theme.yaml#/Save"}
      responses:
        '200':
          description: Theme in requested tenant.
          content:
            application/json:
              schema: {$ref: "./catalog/theme.yaml#/Editor"}
        '400': {description: Invalid theme fields}
        '401': {description: Invalid token}
        '403': {description: Access denied}
        '409': {description: Revision has changed}
  /api/tenants/{slug}/catalog/theme/apply:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    post:
      operationId: publishTheme
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./catalog/theme.yaml#/Apply"}
      responses:
        '200':
          description: Theme in requested tenant.
          content:
            application/json:
              schema: {$ref: "./catalog/theme.yaml#/Active"}
        '400': {description: Invalid theme fields}
        '401': {description: Invalid token}
        '403': {description: Access denied}
        '409': {description: Revision has changed}
  /api/tenants/{slug}/catalog/theme/rollback:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    post:
      operationId: rollbackTheme
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./catalog/theme.yaml#/Rollback"}
      responses:
        '200':
          description: Theme in requested tenant.
          content:
            application/json:
              schema: {$ref: "./catalog/theme.yaml#/Active"}
        '400': {description: Invalid theme fields}
        '401': {description: Invalid token}
        '403': {description: Access denied}
        '409': {description: Revision has changed}
  /api/tenants/{slug}/projects/{projectId}/files/intents:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: createFileIntent
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./attachments/project-file.yaml#/Request"}
      responses:
        '200':
          description: File operation completed.
          content:
            application/json:
              schema: {$ref: "./attachments/project-file.yaml#/Intent"}
        '400': {description: Invalid file}
        '401': {description: Invalid token}
        '403': {description: Permission denied}
        '404': {description: File or project unavailable}
        '409': {description: Expired intent or changed project}
  /api/tenants/{slug}/projects/{projectId}/files/{id}/finalize:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: finalizeFile
      security: [{bearer: []}]
      responses:
        '200':
          description: File operation completed.
          content:
            application/json:
              schema: {$ref: "./attachments/project-file.yaml#/File"}
        '400': {description: Invalid file}
        '401': {description: Invalid token}
        '403': {description: Permission denied}
        '404': {description: File or project unavailable}
        '409': {description: Expired intent or changed project}
  /api/tenants/{slug}/projects/{projectId}/files/{id}/download:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getFileDownload
      security: [{bearer: []}]
      responses:
        '200':
          description: File operation completed.
          content:
            application/json:
              schema: {$ref: "./attachments/project-file.yaml#/Download"}
        '400': {description: Invalid file}
        '401': {description: Invalid token}
        '403': {description: Permission denied}
        '404': {description: File or project unavailable}
        '409': {description: Expired intent or changed project}
  /api/tenants/{slug}/internal/catalog/authorize:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    post:
      operationId: authorizeCatalog
      security: [{bearer: [], catalogService: []}]
      parameters:
        - {name: action, in: query, required: true, schema: {type: string, enum: [read, write]}}
      responses:
        '200':
          description: Live scope from IAM.
          content:
            application/json:
              schema: {$ref: './catalog/config-override.yaml#/Decision'}
        '401': {description: Invalid service or identity}
        '403': {description: Inactive account or insufficient permission}
  /api/tenants/{slug}/catalog/configurations:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: listConfigurations
      security: [{bearer: []}]
      parameters:
        - {name: keyword, in: query, schema: {type: string}}
        - {name: refer, in: query, schema: {type: string}}
        - {name: group, in: query, schema: {type: string}}
        - {name: createdFrom, in: query, description: Inclusive creation time or first day in Asia/Ho_Chi_Minh., schema: {type: string}}
        - {name: createdTo, in: query, description: Inclusive creation time or entire last day in Asia/Ho_Chi_Minh., schema: {type: string}}
        - {name: modifiedFrom, in: query, description: Inclusive modification time or first day in Asia/Ho_Chi_Minh., schema: {type: string}}
        - {name: modifiedTo, in: query, description: Inclusive modification time or entire last day in Asia/Ho_Chi_Minh., schema: {type: string}}
        - {name: active, in: query, schema: {type: boolean}}
        - {name: public, in: query, schema: {type: boolean}}
        - {name: skip, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer}}

      responses:
        '200':
          description: Scoped metadata, total count and edit permission.
          content:
            application/json:
              schema:
                type: object
                required: [items,total,scope,canWrite]
                properties:
                  items: {type: array, items: {$ref: './catalog/config-override.yaml#/Meta'}}
                  total: {type: integer}
                  scope: {type: string, enum: [tenant, shared]}
                  canWrite: {type: boolean}
    post:
      operationId: createConfiguration
      security: [{bearer: []}]
      parameters:
        - {name: detect, in: query, schema: {type: boolean}}
      requestBody: {$ref: '#/components/requestBodies/configuration'}
      responses:
        '200': {$ref: '#/components/responses/configuration'}
        '409': {description: Duplicate scope and canonical key}
  /api/tenants/{slug}/catalog/configurations/home-layouts/{role}:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: role, in: path, required: true, schema: {$ref: './catalog/home-layout.yaml#/Role'}}
    get:
      operationId: getHomeLayoutSettings
      security: [{bearer: []}]
      parameters:
        - {name: skip, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Effective role layout and this school's audit history, newest first.
          content:
            application/json: {schema: {$ref: './catalog/home-layout.yaml#/LayoutSettings'}}
        '400': {$ref: '#/components/responses/domainError'}
        '401': {$ref: '#/components/responses/domainError'}
        '403': {$ref: '#/components/responses/domainError'}
    put:
      operationId: saveHomeLayoutSettings
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: './catalog/home-layout.yaml#/Update'}}
      responses:
        '200':
          description: Saved role layout and first page of history, in the same transaction.
          content:
            application/json: {schema: {$ref: './catalog/home-layout.yaml#/LayoutSettings'}}
        '400': {$ref: '#/components/responses/domainError'}
        '401': {$ref: '#/components/responses/domainError'}
        '403': {$ref: '#/components/responses/domainError'}
        '409': {$ref: '#/components/responses/domainError'}
  /api/tenants/{slug}/catalog/configurations/{key}:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: key, in: path, required: true, schema: {type: string}}
    get:
      operationId: getConfiguration
      security: [{bearer: []}]
      responses:
        '200':
          description: Original bytes, with effective scope and cache status.
          headers:
            X-Cache: {schema: {type: string, enum: [HIT, MISS]}}
            X-RMS-Scope: {schema: {type: string, enum: [tenant, shared]}}
          content:
            '*/*': {schema: {type: string, format: binary}}
        '404': {description: Missing effective key}
    put:
      operationId: updateConfiguration
      security: [{bearer: []}]
      requestBody: {$ref: '#/components/requestBodies/configuration'}
      responses:
        '200': {$ref: '#/components/responses/configuration'}
        '404': {description: Key missing in writable scope}
    delete:
      operationId: deleteConfiguration
      security: [{bearer: []}]
      responses:
        '204': {description: Deleted in writable scope}
        '404': {description: Key missing in writable scope}

  /api/tenants/{slug}/catalog/values/{key}:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: key, in: path, required: true, schema: {type: string}}
    get:
      operationId: getCatalogValue
      security: [{bearer: []}]
      responses:
        '200':
          description: Effective configuration up to 64 KiB for business modules.
          content:
            application/json:
              schema:
                type: object
                required: [content,scope,cache,mime]
                properties:
                  content: {type: string, format: byte}
                  scope: {type: string, enum: [tenant,shared]}
                  cache: {type: string, enum: [HIT,MISS]}
                  mime: {type: string}
        '413': {description: Use the dedicated B01 download route}
    post:
      operationId: createCatalogValue
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './catalog/config-override.yaml#/Input'}
      responses:
        '200': {$ref: '#/components/responses/configuration'}
        '413': {description: Use the dedicated B01 upload route}
    put:
      operationId: updateCatalogValue
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './catalog/config-override.yaml#/Input'}
      responses:
        '200': {$ref: '#/components/responses/configuration'}
        '413': {description: Use the dedicated B01 upload route}

  /api/tenants/{slug}/projects:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: listAccessibleProjects
      security: [{bearer: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: skip, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Projects visible to the active account.
          content:
            application/json:
              schema:
                type: object
                required: [items,total]
                properties:
                  total: {type: integer}
                  items: {type: array, items: {$ref: './audit/audit-trail.yaml#/Source'}}
  /api/tenants/{slug}/projects/{projectId}/audit:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getProjectTrail
      security: [{bearer: []}]
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: skip, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Project and its authorized audit events.
          content:
            application/json:
              schema: {$ref: './audit/audit-trail.yaml#/Trail'}
        '404': {description: Project unavailable}
  /api/tenants/{slug}/users/me:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: getOwnProfile
      security: [{bearer: []}]
      responses:
        '200':
          description: Account operation completed within current scope.
          content:
            application/json:
              schema: {$ref: './iam/lock-account.yaml#/Profile'}
        '403': {description: Inactive or insufficient permissions}
        '404': {description: Account unavailable}
    patch:
      operationId: saveOwnProfile
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './iam/lock-account.yaml#/ProfileChange'}
      responses:
        '200':
          description: Account operation completed within current scope.
          content:
            application/json:
              schema: {$ref: './iam/lock-account.yaml#/Profile'}
        '403': {description: Inactive or insufficient permissions}
        '404': {description: Account unavailable}

  /api/tenants/{slug}/admin/users:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: listManagedAccounts
      security: [{bearer: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: skip, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Account operation completed within current scope.
          content:
            application/json:
              schema: {type: object, required: [items,total], properties: {items: {type: array, items: {$ref: './iam/lock-account.yaml#/Profile'}}, total: {type: integer}}}
        '403': {description: Inactive or insufficient permissions}
        '404': {description: Account unavailable}

    post:
      operationId: precreateAccount
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "./iam/provision.yaml#/Create"}}
      responses:
        '200':
          description: Account provisioned by an authorized administrator.
          content:
            application/json: {schema: {$ref: "./iam/lock-account.yaml#/Profile"}}
        '400': {$ref: '#/components/responses/domainError'}
        '403': {$ref: '#/components/responses/domainError'}
        '409': {$ref: '#/components/responses/domainError'}
        '503': {$ref: '#/components/responses/domainError'}
  /api/tenants/{slug}/admin/users/{id}:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getManagedAccount
      security: [{bearer: []}]
      responses:
        '200':
          description: Account operation completed within current scope.
          content:
            application/json:
              schema: {$ref: './iam/lock-account.yaml#/Receipt'}
        '403': {description: Inactive or insufficient permissions}
        '404': {description: Account unavailable}
    delete:
      operationId: deactivateAccount
      security: [{bearer: []}]
      responses:
        '200':
          description: Account operation completed within current scope.
          content:
            application/json:
              schema: {$ref: './iam/lock-account.yaml#/Receipt'}
        '403': {description: Inactive or insufficient permissions}
        '404': {description: Account unavailable}

  /api/tenants/{slug}/admin/users/{id}/lock:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: lockAccount
      security: [{bearer: []}]
      responses:
        '200':
          description: Account operation completed within current scope.
          content:
            application/json:
              schema: {$ref: './iam/lock-account.yaml#/Receipt'}
        '403': {description: Inactive or insufficient permissions}
        '404': {description: Account unavailable}

  /api/tenants/{slug}/admin/users/{id}/unlock:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: unlockAccount
      security: [{bearer: []}]
      responses:
        '200':
          description: Account operation completed within current scope.
          content:
            application/json:
              schema: {$ref: './iam/lock-account.yaml#/Receipt'}
        '403': {description: Inactive or insufficient permissions}
        '404': {description: Account unavailable}

  /api/tenants/{slug}/admin/users/{id}/change-role:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: changeAccountRole
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [userType], properties: {userType: {type: string, enum: [user,author,staff,admin]}}}
      responses:
        '200':
          description: Account operation completed within current scope.
          content:
            application/json:
              schema: {$ref: './iam/lock-account.yaml#/Receipt'}
        '403': {description: Inactive or insufficient permissions}
        '404': {description: Account unavailable}

  /api/tenants/{slug}/workflow/active:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: getActiveWorkflow
      security: [{bearer: []}]
      responses:
        '200':
          description: Configured graph or revision zero for a fresh tenant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowTemplate'}
    put:
      operationId: activateWorkflow
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowTemplate'}
      responses:
        '200':
          description: Newly activated version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowTemplate'}
        '400': {description: Invalid step or transition}
        '409': {description: Active revision changed}
  /api/tenants/{slug}/projects/{projectId}/workflow:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getProjectWorkflow
      security: [{bearer: []}]
      responses:
        '200':
          description: Pinned version, current step and candidate actions for this role.
          content:
            application/json:
              schema:
                type: object
                required: [version,step,semantic,next]
                properties:
                  version: {type: integer}
                  step: {type: string}
                  semantic: {type: string}
                  next: {type: array, items: {type: object, required: [code,to], properties: {code: {type: string}, to: {type: string}}}}
        '404': {description: Project unavailable}
  /api/tenants/{slug}/calls:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: listCalls
      security: [{bearer: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: group, in: query, schema: {type: string, enum: [receiving,all]}}
        - {name: skip, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Scoped intake call response.
          content:
            application/json:
              schema: {$ref: './call/open-call.yaml#/Listing'}
        '400': {$ref: '#/components/responses/domainError'}
        '403': {$ref: '#/components/responses/domainError'}
        '404': {$ref: '#/components/responses/domainError'}
        '409': {$ref: '#/components/responses/domainError'}
    post:
      operationId: saveNewCall
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './call/open-call.yaml#/Input'}
      responses:
        '200':
          description: Scoped intake call response.
          content:
            application/json:
              schema: {$ref: './call/open-call.yaml#/Row'}
        '400': {$ref: '#/components/responses/domainError'}
        '403': {$ref: '#/components/responses/domainError'}
        '404': {$ref: '#/components/responses/domainError'}
        '409': {$ref: '#/components/responses/domainError'}

  /api/tenants/{slug}/calls/references:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
    get:
      operationId: listIntakeReferences
      security: [{bearer: []}]
      responses:
        '200':
          description: Scoped intake call response.
          content:
            application/json:
              schema: {type: array, items: {$ref: './call/open-call.yaml#/Reference'}}
        '400': {$ref: '#/components/responses/domainError'}
        '403': {$ref: '#/components/responses/domainError'}
        '404': {$ref: '#/components/responses/domainError'}
        '409': {$ref: '#/components/responses/domainError'}

  /api/tenants/{slug}/calls/{id}:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getCall
      security: [{bearer: []}]
      responses:
        '200':
          description: Scoped intake call response.
          content:
            application/json:
              schema: {$ref: './call/open-call.yaml#/Row'}
        '400': {$ref: '#/components/responses/domainError'}
        '403': {$ref: '#/components/responses/domainError'}
        '404': {$ref: '#/components/responses/domainError'}
        '409': {$ref: '#/components/responses/domainError'}
    put:
      operationId: editCall
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './call/open-call.yaml#/Input'}
      responses:
        '200':
          description: Scoped intake call response.
          content:
            application/json:
              schema: {$ref: './call/open-call.yaml#/Row'}
        '400': {$ref: '#/components/responses/domainError'}
        '403': {$ref: '#/components/responses/domainError'}
        '404': {$ref: '#/components/responses/domainError'}
        '409': {$ref: '#/components/responses/domainError'}

  /api/tenants/{slug}/calls/{id}/actions:
    parameters:
      - {$ref: '#/components/parameters/tenantSlug'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: changeCallStatus
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './call/open-call.yaml#/Change'}
      responses:
        '200':
          description: Scoped intake call response.
          content:
            application/json:
