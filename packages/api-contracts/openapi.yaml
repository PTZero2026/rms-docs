components:
  schemas:
    WorkflowTemplate:
      type: object
      required: [version,graph]
      properties:
        version: {type: integer, minimum: 0}
        graph: {$ref: './workflow/workflow-version.yaml'}
    WorkflowGraph: {$ref: "./workflow/workflow-version.yaml"}
    ThemeTokens: {$ref: "./catalog/theme-tokens.yaml"}
  parameters:
    tenantSlug:
      name: slug
      in: path
      required: true
      schema: {type: string}
  requestBodies:
    configuration:
      required: true
      content:
        application/json: {schema: {$ref: './catalog/config-override.yaml#/Input'}}
        application/x-www-form-urlencoded: {schema: {$ref: './catalog/config-override.yaml#/Input'}}
        multipart/form-data:
          schema:
            allOf:
              - {$ref: './catalog/config-override.yaml#/Input'}
              - {type: object, properties: {content: {type: string, format: binary}}}
  responses:
    domainError:
      description: Domain validation or access error.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode,message]
            properties:
              statusCode: {type: integer}
              message: {type: string}
    configuration:
      description: Configuration metadata.
      content:
        application/json: {schema: {$ref: './catalog/config-override.yaml#/Meta'}}
  securitySchemes:
    teachingService: {type: apiKey, in: header, name: X-RMS-Teaching-Service}
    reminderService: {type: apiKey, in: header, name: X-RMS-Reminder-Service}
    catalogService: {type: apiKey, in: header, name: X-RMS-Service}
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
