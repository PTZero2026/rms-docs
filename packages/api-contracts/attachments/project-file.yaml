Request:
  type: object
  required: [filename, mime, size, sha256, resourceVersion]
  properties:
    filename: {type: string, maxLength: 200}
    mime: {type: string}
    size: {type: integer, minimum: 1, maximum: 20971520}
    sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    resourceVersion: {type: integer, minimum: 0}
Intent:
  type: object
  required: [id,url,fields]
  properties:
    id: {type: string, format: uuid}
    url: {type: string, format: uri}
    fields: {type: object, additionalProperties: {type: string}}
File:
  type: object
  required: [id,filename,sha256]
  properties:
    id: {type: string, format: uuid}
    filename: {type: string}
    sha256: {type: string}
Download:
  type: object
  required: [url,ttlSeconds]
  properties:
    url: {type: string}
    ttlSeconds: {type: integer}
