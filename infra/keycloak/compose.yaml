services:
  idp:
    build: .
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://127.0.0.1:8180
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
    depends_on: [mailpit]
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"
